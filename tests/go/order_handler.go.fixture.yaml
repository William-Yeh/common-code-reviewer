version: 1
language: go
source: "order_handler.go"
required:
  - rule: common/sql-injection
    location: "34-39, 71"
    rationale: "SQL built with fmt.Sprintf twice: request-body values in the INSERT and the row id in the N+1 SELECT (85, second-order). One finding may cover both sites; use parameterized queries ($1, $2)."
  - rule: common/ignored-error
    location: "30"
    rationale: "ShouldBindJSON error ignored. Invalid JSON silently proceeds with zero-value body."
  - rule: common/missing-input-validation
    location: "32"
    rationale: "body[\"customer_id\"].(string) asserts untrusted request input without the comma-ok form or any presence/type check, so a missing field panics. No error is discarded here; the defect is unvalidated input at the boundary."
  - rule: common/ignored-error
    location: "68, 70, 77"
    rationale: "ListOrders discards three errors: rows.Scan (81), the per-order db.Query via _ (84), and itemRows.Scan (91). Zero-valued rows are returned as data and a nil itemRows panics. One finding may cover the sites together."
  - rule: common/ignored-error
    location: "70"
    rationale: "Error discarded with blank identifier _ on N+1 query. Query failures silently produce nil rows."
  - rule: common/resource-leak
    location: "58"
    rationale: "Missing defer rows.Close() after db.Query. Connection leak will exhaust connection pool."
  - rule: common/god-module
    location: "28"
    rationale: "God function CreateOrder — handles binding, SQL, caching, and notification. Separate into handler → service → repository."
  - rule: common/shared-mutable-state
    location: "14-18"
    rationale: "Package-level mutable globals in var ( ... ): db reassigned by InitDB without synchronization, orderCache shared by every request. Inject dependencies instead."
  - rule: common/n-plus-one-hot-path
    location: "70-72"
    rationale: "N+1 query inside the ListOrders gin handler: one SELECT ... FROM order_items per order on every request. Use a JOIN or batch query."
  - rule: common/unbounded-query
    location: "58"
    rationale: "Unbounded SELECT ... FROM orders with no LIMIT or pagination."
  - rule: common/unmanaged-concurrency
    location: "52"
    rationale: "Goroutine go notifyWarehouse(body) without lifecycle management. No errgroup, no context cancellation — goroutine leak."
  - rule: common/weak-type-model
    location: "29, 91"
    rationale: "map[string]interface{} used for request body and throughout. Define typed structs for Order, OrderItem."
  - rule: common/ignored-error
    location: "20-25"
    rationale: "InitDB only logs the sql.Open error and returns normally, leaving db nil; execution continues unsafely and the first query panics. Return the error instead."
  - rule: common/sensitive-data-exposure
    location: "60"
    rationale: "Internal error details leaked to client via err.Error() in JSON response. Return generic message, log details."
  - rule: common/ignored-error
    location: "92"
    rationale: "json.Marshal error ignored with blank identifier."
  - rule: common/missing-timeout
    location: "94-95"
    rationale: "No timeout on http.Post — will use http.DefaultClient with no timeout. Can hang indefinitely."
  - rule: common/incomplete-error-handling
    location: "44, 97"
    rationale: "Recoverable failures reported insufficiently: the insert error is replaced by \"failed\" and never logged (54), and the notify error is logged without wrapping or the order id (114)."
  - rule: common/language-idiom
    location: "16, 20, 24, 91, 97"
    rationale: "Legacy idioms: interface{} instead of any (20, 106), function signatures without a leading context.Context (25, 106), and log.Println instead of an injected *slog.Logger (30, 114). One finding may list them together."
  - rule: common/graceful-shutdown
    location: "111-113"
    rationale: "Serve blocks in gin.Engine.Run, which wraps http.ListenAndServe with no http.Server to call Shutdown on and no signal handling, so a deploy or SIGTERM drops in-flight orders mid-request. Build an http.Server and call Shutdown(ctx) from signal.NotifyContext."
forbidden:
  - rule: common/n-plus-one-query
    location: "70-72"
    rationale: "This N+1 runs inside a gin handler, so it is common/n-plus-one-hot-path; the two N+1 rules are mutually exclusive by request path."
