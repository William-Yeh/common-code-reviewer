version: 1
language: rust
source: "user_service.rs"
required:
  - rule: rust/unsafe-without-safety
    location: "103"
    rationale: "data.get_unchecked(0) in an unsafe block with no // SAFETY: comment — and it's UB when data is empty. Use the safe data.first() / data.get(0) which returns Option."
  - rule: common/interface-segregation
    location: "10-19"
    rationale: "UserStore trait has 8 methods. A read-only consumer must still implement save, delete, bulk_import, export_csv, etc. Split into UserReader / UserWriter / UserReporter."
  - rule: rust/stringly-typed-domain
    location: "22-42"
    rationale: "handle_user_action matches on an action &str; each new action edits this function. Model actions as an enum so the match is exhaustive and the compiler enforces new arms."
  - rule: common/unhandled-variant
    location: "40"
    rationale: "`_ => Ok(())` makes any unknown action report success while doing nothing: an unknown variant silently takes an unsafe default path. Return an error for unrecognized actions."
  - rule: common/anemic-domain
    location: "46-53"
    rationale: "User is a pure data bag — all behavior (activation, counting, deactivation) lives in free functions and UserService."
  - rule: rust/erased-public-error
    location: "13-18, 22, 70, 121"
    rationale: "Public API returns Box<dyn Error>, erasing the error variant so callers can't match on it. Expose a typed error enum (e.g. via thiserror)."
  - rule: common/hidden-side-effect
    location: "56-62"
    rationale: "count_active_users is named as a pure count but writes /tmp/user-stats.txt. Extract the side effect; keep the counter pure."
  - rule: common/hard-coded-dependency
    location: "58, 71"
    rationale: "SystemTime::now() and the hardcoded /etc/app/users.json path make these non-deterministic and untestable. Inject a clock and a config source/Reader."
  - rule: rust/shared-mutex-overuse
    location: "66"
    rationale: "cache: Arc<Mutex<HashMap<...>>> introduces shared mutability before it's shown to be needed. If the service has a single owner, &mut self + a plain HashMap avoids the lock and its panic surface."
  - rule: rust/clone-to-compile
    location: "78, 89, 110"
    rationale: "user.clone() / x.clone() clone whole User values (in cache_user, in the loop in deactivate_inactive, and in proc) to satisfy the borrow checker. Restructure to move or store references/Arc<User>."
  - rule: common/deep-nesting
    location: "84-96"
    rationale: "deactivate_inactive nests if 4 levels deep. Flatten with early continue, or extract a should_deactivate(&User, days) predicate and filter."
  - rule: common/unclear-name
    location: "106-114"
    rationale: "proc, d, f, r, x reveal no intent. Rename to users_with_role(users, role) etc."
  - rule: common/dead-code
    location: "116-118"
    rationale: "old_notify is never called. Remove it."
  - rule: common/dependency-inversion
    location: "121-123"
    rationale: "remove_user takes the concrete &mut PostgresStore instead of &mut impl UserStore. Depend on the abstraction so it works with any store and is testable with a fake."
  - rule: rust/stringly-typed-domain
    location: "50, 51"
    rationale: "`role: String` and `status: String` model closed sets (\"admin\", \"active\", \"protected\", \"inactive\" are compared later); they should be Role / Status enums so the compiler rejects invalid values."
  - rule: rust/raw-domain-value
    location: "47, 52"
    rationale: "`id: String` and `last_login: u64` (epoch seconds) are open-ended domain values passed as raw primitives; UserId and a timestamp newtype stop them being swapped or mixed with other strings and integers."
  - rule: rust/panic-in-library
    location: "60"
    rationale: "std::fs::write(...).unwrap() in a non-test path panics on any I/O error. Propagate with ? instead."
forbidden: []
