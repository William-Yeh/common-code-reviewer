version: 1
language: java
source: "OrderController.java"
required:
  - rule: common/sql-injection
    location: "52-58"
    rationale: "SQL injection via string concatenation in createOrder. User input directly concatenated into SQL. Use parameterized queries."
  - rule: common/sql-injection
    location: "74-75"
    rationale: "SQL injection via string concatenation in searchOrders. Same pattern repeated."
  - rule: common/incomplete-error-handling
    location: "63-64"
    rationale: "catch (Exception e) { e.printStackTrace(); } swallows a failed warehouse notification to stderr with no logging context or retry. The catch clause and its body are one construct. Use an SLF4J logger and catch specific exceptions."
  - rule: common/god-module
    location: "34"
    rationale: "God class: OrderController does routing, SQL building (jdbcTemplate.execute), JPA queries (entityManager), caching, and raw HTTP calls to the warehouse. Unrelated responsibilities is common/god-module, not framework coupling."
  - rule: common/hard-coded-dependency
    location: "36-40"
    rationale: "Field injection: @Autowired private JdbcTemplate/EntityManager can only be replaced by reflection or a Spring context, so tests cannot substitute them. That is common/hard-coded-dependency; use constructor injection."
  - rule: common/framework-coupling
    location: "9, 50, 69"
    rationale: "The JPA @Entity Order is bound from @RequestBody and returned as the response, so the API contract is the persistence model and changes whenever the schema does. SKILL.md names an ORM entity used as the API payload as common/framework-coupling. Use request and response records."
  - rule: common/weak-type-model
    location: "42, 45"
    rationale: "Raw types: Map cache = new HashMap() and List getAllOrders() without generic parameters."
  - rule: common/unbounded-query
    location: "46"
    rationale: "Unbounded JPQL query SELECT o FROM Order o with no pagination (setMaxResults, Pageable)."
  - rule: common/missing-input-validation
    location: "50"
    rationale: "No @Valid on @RequestBody. No input validation constraints. Entity lacks Bean Validation annotations."
  - rule: common/weak-type-model
    location: "17"
    rationale: "private double price: binary floating point cannot represent currency exactly and admits NaN and negatives. Use BigDecimal or a Money type. A type-model problem, not a god module."
  - rule: common/missing-timeout
    location: "87-88, 91, 92"
    rationale: "No timeout set on HttpURLConnection. No try-with-resources for streams. Connection/stream leak risk."
  - rule: common/incomplete-error-handling
    location: "86"
    rationale: "throws Exception — overly broad. Declare specific exception types."
  - rule: common/language-idiom
    location: "83"
    rationale: ".collect(Collectors.toList()) — use .toList() (JDK 16+) for unmodifiable list."
  - rule: common/shared-mutable-state
    location: "42"
    rationale: "HashMap cache without synchronization. Concurrent requests cause data races. Consider ConcurrentHashMap or proper caching solution."
forbidden: []
