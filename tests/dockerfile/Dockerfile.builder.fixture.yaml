version: 1
language: dockerfile
source: "Dockerfile.builder"
required:
  - rule: dockerfile/mutable-base
    location: "1, 7"
    rationale: "FROM golang:1.22-alpine uses a mutable tag. Tags can be overwritten — pin to a digest for reproducible builds (e.g. golang:1.22-alpine@sha256:<digest>). Same applies to alpine:3.19."
  - rule: dockerfile/root-runtime
    rationale: "Absence finding: the final stage has no USER instruction, so the server runs as root. SKILL.md cites absence findings without a fabricated line. Add a non-root numeric user and switch to it before ENTRYPOINT."
  - rule: dockerfile/broad-stage-copy
    location: "12"
    rationale: "COPY --from=build / / copies the entire build filesystem — including the Go toolchain (/usr/local/go), build cache, and test artifacts — into the runtime image. Copy only the compiled binary: COPY --from=build /app/server /app/server."
  - rule: dockerfile/unverified-artifact
    location: "17-19"
    rationale: "wget downloads a binary without checksum verification. A compromised release or MITM can substitute a malicious binary. Verify with sha256sum after download."
  - rule: dockerfile/confused-build-runtime-config
    location: "14, 24"
    rationale: "LOG_LEVEL is runtime configuration declared as an ARG, which exists only during the build. The exec-form ENTRYPOINT does no variable expansion either, so the server receives the literal string --log-level=${LOG_LEVEL}. Declare it as ENV LOG_LEVEL=info and read it in the process, or pass it at docker run."
  - rule: dockerfile/missing-healthcheck
    rationale: "No HEALTHCHECK instruction. For a gRPC service, use grpc_health_probe that is already downloaded: HEALTHCHECK CMD grpc_health_probe -addr=:8080 || exit 1."
  - rule: dockerfile/unnamed-stage
    location: "7"
    rationale: "The runtime FROM alpine:3.19 stage is unnamed. Add AS runtime (or AS final) for readability and to enable targeted builds (docker build --target runtime)."
forbidden:
  - rule: dockerfile/heavy-runtime-base
    location: "7"
    rationale: "The runtime stage uses alpine:3.19, a minimal base. It is still a mutable tag (dockerfile/mutable-base), but not a full distribution."
