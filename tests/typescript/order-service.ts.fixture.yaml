version: 1
language: typescript
source: "order-service.ts"
required:
  - rule: common/sql-injection
    location: "21-24"
    rationale: "SQL injection via string interpolation in createOrder. User input directly embedded in SQL query."
  - rule: common/sql-injection
    location: "39-42"
    rationale: "SQL injection via string interpolation in searchOrders. Same pattern repeated."
  - rule: common/ignored-error
    location: "29"
    rationale: "Empty catch block catch (e) {} silently swallows warehouse notification failure."
  - rule: common/god-module
    location: "8"
    rationale: "God controller — mixes HTTP handling, business logic, data access, and caching in a single class. Should separate into Controller → Service → Repository layers."
  - rule: common/layer-violation
    location: "9-10"
    rationale: "The controller holds TypeORM's DataSource and runs raw SQL itself, so presentation code depends directly on infrastructure. That is common/layer-violation: move data access into a repository the controller calls."
  - rule: common/weak-type-model
    location: "5, 19, 38, 44, 56"
    rationale: "any type used in multiple places: orderCache, body parameters, results array, notifyWarehouse parameter. Disables type safety."
  - rule: common/missing-input-validation
    location: "19"
    rationale: "createOrder(@Body() body) takes an untyped request body with no DTO or class-validator constraints, so untrusted input crosses the HTTP boundary unvalidated. (Was interface-segregation, which describes interfaces forcing stubs, not this.)"
  - rule: common/unbounded-query
    location: "14"
    rationale: "Unbounded SELECT * FROM orders with no LIMIT or pagination. Will OOM on large tables."
  - rule: common/shared-mutable-state
    location: "5"
    rationale: "Module-level mutable let orderCache — shared mutable state across requests."
  - rule: common/imperative-transformation
    location: "44-51"
    rationale: "forEach with side effect (pushing to external array). Should use map to transform."
  - rule: common/magic-literal
    location: "26"
    rationale: "Magic number 500 — no explanation of why this threshold triggers warehouse notification."
  - rule: common/incomplete-error-handling
    location: "59-63"
    rationale: "The fetch response is never checked: fetch only rejects on network errors, so a 4xx/5xx from the warehouse passes as success. (Was language-idiom, but an unchecked failure is incomplete error handling.)"
  - rule: common/sensitive-data-exposure
    location: "57"
    rationale: "console.log writes the whole order, including the customer ID from the request body, to stdout in production; log the order ID through a structured logger instead. (Was incomplete-error-handling, which this line is not.)"
  - rule: common/style-naming
    location: "8"
    rationale: "`export default class OrderController` lets every importer pick its own name for the class, so the codebase's names for it drift; a named export fixes the name (typescript.md Style Standard: no default exports)."
forbidden: []
