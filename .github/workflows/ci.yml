name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      run_conformance:
        description: "Run live Claude Code conformance"
        type: boolean
        default: false

jobs:
  validate-structure:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Validate skill and deterministic conformance
        run: uv run tests/scripts/validate_structure.py

      - name: Test conformance matcher
        run: uv run tests/scripts/test_conformance.py

  live-conformance:
    name: Live Claude Code Conformance
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.run_conformance == 'true')
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Require Anthropic credentials
        run: test -n "$ANTHROPIC_API_KEY"

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run live conformance
        run: >-
          uv run tests/scripts/run_conformance.py
          --model sonnet
          --max-budget-usd 0.50
          --report conformance-report.json

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-conformance
          path: conformance-report.json
          if-no-files-found: warn
